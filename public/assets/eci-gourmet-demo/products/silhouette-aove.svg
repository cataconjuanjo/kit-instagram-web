    <!-- cuerpo botella cuadrada estilo AOVE premium -->
    <path d="M158 280 C150 280 144 274 144 266 L144 185 C144 170 152 158 162 148 L162 115 L238 115 L238 148 C248 158 256 170 256 185 L256 266 C256 274 250 280 242 280 Z" fill="#E8E8E8" stroke="#C0C0C0"/>
    <!-- cuello -->
    <rect x="173" y="80" width="54" height="40" rx="5" fill="#EFEFEF" stroke="#C0C0C0"/>
    <!-- tapón -->
    <rect x="182" y="68" width="36" height="18" rx="4" fill="#D8D8D8" stroke="#C0C0C0"/>
    <!-- contenido aceite (tono ámbar muy claro) -->
