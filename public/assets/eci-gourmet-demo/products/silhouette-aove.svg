    <!-- etiqueta -->
    <rect x="155" y="208" width="90" height="56" rx="3" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1.5"/>
    <line x1="165" y1="222" x2="235" y2="222" stroke="#D0D0D0" stroke-width="1.5"/>
    <line x1="165" y1="233" x2="235" y2="233" stroke="#D0D0D0" stroke-width="1.5"/>
    <line x1="165" y1="244" x2="218" y2="244" stroke="#D0D0D0" stroke-width="1.5"/>
  </g>
</svg>
